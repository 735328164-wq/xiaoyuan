<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="佛山科学技术学院充电站 · 空闲充电桩实时看板">
<title>空闲充电桩 · 实时看板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
<style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a2f3a;--dim:#8b93a7;
--free:#22c55e;--freebg:#0d3320;--busy:#3a4150;--warn:#f59e0b;--txt:#e8ecf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
padding:14px 12px 40px;max-width:560px;margin:0 auto}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#0d3320,#12202e);border:1px solid #1f4d33;
border-radius:14px;padding:16px;margin-bottom:14px}
.hero .n{font-size:40px;font-weight:700;color:var(--free);line-height:1}
.hero .n small{font-size:14px;color:var(--dim);font-weight:400;margin-left:6px}
.hero .hint{margin-top:6px;font-size:13px;color:#9fe3b8}
.hero.nofree{background:linear-gradient(135deg,#2a2113,#241c12);border-color:#4a3a0f}
.hero.nofree .n{color:var(--warn)}
.hero.nofree .hint{color:#e5c07b}
.bar{display:flex;gap:8px;margin-bottom:14px}
button{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);
border-radius:10px;padding:11px;font-size:14px}
button:active{background:#252b36}
.zhead{display:flex;justify-content:space-between;align-items:baseline;
margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.zname{font-size:15px;font-weight:600;letter-spacing:.5px}
.zfree{font-size:12px;color:var(--dim)}
.zfree b{color:var(--free)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:12px;margin-bottom:9px}
.card.free{border-color:#1f4d33}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.sn{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.3px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-free{background:var(--freebg);color:var(--free)}
.t-full{background:#262b35;color:var(--dim)}
.plugs{display:flex;flex-wrap:wrap;gap:6px}
.p{width:38px;height:34px;border-radius:8px;display:flex;align-items:center;
justify-content:center;font-size:14px;font-weight:600;background:var(--busy);color:#6f798d}
.p.on{background:var(--free);color:#05240f}
.gray{color:var(--dim);font-size:12px}
.skel{color:var(--dim);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<h1 id="st">空闲充电桩</h1>
<div class="sub" id="sub">加载中…</div>

<div class="hero" id="hero">
  <div class="n"><span id="cnt">–</span><small id="cntu">个空闲口</small></div>
  <div class="hint" id="best">正在扫描…</div>
</div>

<div class="bar">
  <button onclick="load(true)">🔄 立即刷新</button>
  <button id="auto" onclick="toggle()">⏸ 暂停自动</button>
</div>

<div id="list"><div class="skel">正在读取各桩状态…</div></div>

<div class="zhead"><span class="zname">计费</span></div>
<div class="gray" id="fee"></div>
<div class="zhead"><span class="zname">说明</span></div>
<div class="gray">
绿色＝空闲可用（去小程序选这个口）｜灰色＝已占用。<br>
数据每 <span id="ttl">12</span> 秒自动刷新，失联/异常的桩已自动隐藏。<br>
<span style="color:#5b6478">数据来自樱花充电小程序接口，仅供查位参考，能否充上以小程序为准。</span>
</div>

<script>
const REFRESH = 12;
let left = REFRESH, running = true;
const $ = (id) => document.getElementById(id);

function render(d) {
  $('st').textContent = d.station;
  $('fee').textContent = d.fee;
  $('cnt').textContent = d.free_total;
  $('sub').textContent = '更新于 ' + new Date(d.ts * 1000).toLocaleTimeString('zh-CN');
  $('hero').className = d.free_total > 0 ? 'hero' : 'hero nofree';

  const good = [];
  d.zones.forEach((z) => z.piles.forEach((p) => { if (p.state === 'free') good.push(p); }));
  if (good.length) {
    $('best').innerHTML = '👉 直接去：' +
      good.map((p) => '<b>' + p.sn + '</b> 口 ' + p.free.join('/')).join('　');
  } else {
    $('best').textContent = '当前没有空闲口，稍后再看 / 去别的区碰碰运气';
  }

  let h = '';
  for (const z of d.zones) {
    h += '<div class="zhead"><span class="zname">' + z.name +
         '</span><span class="zfree">空闲 <b>' + z.free_total + '</b> 口</span></div>';
    if (!z.piles.length) { h += '<div class="gray" style="padding:6px 0">该区域暂无可显示的桩</div>'; continue; }
    for (const p of z.piles) {
      const isFree = p.state === 'free';
      h += '<div class="card ' + p.state + '"><div class="row"><span class="sn">' + p.sn +
           '</span><span class="tag ' + (isFree ? 't-free' : 't-full') + '">' +
           (isFree ? '有空位' : '全满') + '</span></div><div class="plugs">';
      const fs = new Set(p.free);
      for (let i = 1; i <= (p.total || 10); i++)
        h += '<div class="p' + (fs.has(i) ? ' on' : '') + '">' + i + '</div>';
      h += '</div>';
      if (isFree)
        h += '<div class="tag t-free" style="display:inline-block;margin-top:9px">可用口：' +
             p.free.join('、') + '</div>';
      h += '</div>';
    }
  }
  if (d.hidden && d.hidden.length)
    h += '<div class="gray" style="margin-top:14px">已隐藏（失联/无数据）：' + d.hidden.join('、') + '</div>';
  $('list').innerHTML = h;
}

async function load(manual) {
  try {
    const r = await fetch('/api/status?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
    left = REFRESH;
    if (manual) $('sub').textContent += ' · 已手动刷新';
  } catch (e) {
    $('sub').textContent = '读取失败：' + e.message + '（下拉或点刷新重试）';
  }
}

function tick() {
  if (!running) return;
  left--;
  if (left <= 0) load();
  $('auto').textContent = running ? ('⏸ 暂停自动 · ' + Math.max(left, 0) + 's') : '▶ 恢复自动';
}
function toggle() { running = !running; if (running) left = REFRESH; tick(); }

document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
setInterval(tick, 1000);
</script>
</body>
</html>
